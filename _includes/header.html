<header class="site-header">
  <div class="container header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}" rel="home">
      <svg class="site-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <circle cx="16" cy="16" r="5.5" fill="none" stroke="currentColor" stroke-width="2.6"/>
        <path d="M16 10.5 C 16 4, 21 2, 27 3" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M16 21.5 C 16 28, 11 30, 5 29" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <span>{{ site.title }}</span>
    </a>
    <button class="menu-toggle" aria-expanded="false" aria-controls="site-navigation">
      <span class="menu-toggle-open">Menu</span><span class="menu-toggle-close">Close</span>
    </button>
    <nav id="site-navigation" class="main-navigation" aria-label="Main">
      <ul>
        {%- for item in site.data.navigation %}
        {%- assign item_url = item.url | relative_url %}
        <li><a href="{{ item_url }}"{% if page.url == item.url or item.url == '/project-updates/' and page.layout == 'post' %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
  </div>
</header>
